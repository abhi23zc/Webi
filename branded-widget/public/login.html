<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Webi Studio</title><link rel="stylesheet" href="builder.css"><body><main style="margin:auto;max-width:460px;width:100%;padding:60px 24px"><h1>Webi Studio</h1><p>Sign in to manage your chatbots.</p><form id="login"><label for="password">Studio password</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="button primary" style="margin-top:20px">Sign in</button><p id="error" role="alert"></p></form></main><script type="module">document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error);location.href='/'}catch(e){document.getElementById('error').textContent=e.message}})</script></body></html>
