<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat assistant</title><link rel="stylesheet" href="widget.css"><script type="module" src="widget.js"></script></head><body><section class="chat" aria-label="Chat assistant"><header class="chat-header"><div class="avatar" id="avatar" aria-hidden="true"></div><div class="header-copy"><h1 id="chat-name"></h1><p id="tagline"></p><span class="availability"><span></span>AI assistant</span></div><button id="new-chat" type="button" aria-label="Start a new conversation" title="New conversation">↻</button></header><div class="messages" id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></div><div class="suggestions" id="suggestions" aria-label="Conversation starters"></div><p id="error" role="alert" hidden></p><form id="chat-form"><label class="sr-only" for="message">Your message</label><div class="composer"><textarea rows="1" id="message" maxlength="4000" placeholder="Type your message…"></textarea><button id="send" type="submit" aria-label="Send message">↑</button><button id="stop" type="button" aria-label="Stop reply" hidden>■</button></div><p class="footer-note">AI can make mistakes. Check important details.</p></form></section></body></html>
