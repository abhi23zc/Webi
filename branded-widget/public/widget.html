<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat assistant</title><link rel="stylesheet" href="widget.css?v=20261008-2"><script type="module" src="widget.js?v=20261008-2"></script></head><body><section class="chat" aria-label="Chat assistant"><header class="chat-header"><div class="avatar" id="avatar" aria-hidden="true"></div><div class="header-copy"><h1 id="chat-name"></h1><p id="tagline"></p><span class="availability"><span></span>AI assistant</span></div><button id="new-chat" type="button" aria-label="Start a new conversation" title="New conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button><button id="close-chat" class="icon-button" type="button" aria-label="Close chat" title="Close chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header><div class="messages" id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></div><div class="suggestions" id="suggestions" aria-label="Conversation starters"></div><p id="error" role="alert" hidden></p><form id="chat-form"><label class="sr-only" for="message">Your message</label><div class="composer"><textarea rows="1" id="message" maxlength="4000" placeholder="Type your message…"></textarea><button id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button><button id="stop" type="button" aria-label="Stop reply" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></div><p class="footer-note">AI can make mistakes. Check important details.</p></form></section></body></html>
